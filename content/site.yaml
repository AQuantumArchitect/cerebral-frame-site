offers:
  - id: map
    owner_name: Map
    for: Companies that know the week is leaking and do not yet know where.
    weeks: "2 weeks"
    start: after the consultation
    typical: "$5,000–$10,000"
    blurb: Two weeks inside your operation. You get a Frame of it — every number, hand-off, and pile, marked as current, stale, or dark — and a short list of what to build first.
    deliverables: a Frame of the operation, a one-page short list, and the Map notes
  - id: build
    owner_name: Build
    for: Companies with one named problem — from the Map, or from years of living with it.
    weeks: "3–8 weeks, scoped"
    start: after the consultation
    typical: "$10,000–$30,000"
    blurb: One thing the Frame said was costing you, built and shipped. An automation, an integration, a tool your people actually open. Scoped in writing before a line is written.
    deliverables: working software, shipped, with its own node on your Frame
  - id: hold
    owner_name: Hold
    for: Companies whose computer work needs an owner who is not also running the floor.
    weeks: "monthly, cancel with 30 days"
    start: after the consultation
    typical: "$6,000–$15,000 / month"
    blurb: We stay on as your technical lead. The Frame stays live, the backlog has an owner, and the computer work stops being the owner's second job.
    deliverables: a monthly Frame review, an owned backlog, and a phone number that answers
